# This workflow enables Dependabot to automatically rebase dependency updates

name: Review Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  review-dependabot-pr:
    uses: diapolo10/.github/.github/workflows/review-dependabot-pr.yml@aec28ea475a1a1793f55bf72f13255630b332232
    permissions:
      contents: write
      pull-requests: write
      issues: write
