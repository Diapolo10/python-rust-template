# This workflow enables Dependabot to automatically rebase dependency updates

name: Review Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  review-dependabot-pr:
    uses: diapolo10/.github/.github/workflows/review-dependabot-pr.yml@7d9b3e2a0fe514ccfe2ca36b60b0caf345e78c23
    permissions:
      contents: write
      pull-requests: write
      issues: write
