# This generic workflow analyses the repository with CodeQL

name: CodeQL analysis

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    uses: diapolo10/.github/.github/workflows/codeql.yml@1d2f3cc5e802b23d8ab85dad2c54dedd6e4ce1ab
    with:
      languages: '["actions", "python", "rust"]'
