# This workflow automatically creates a GitHub release for the project on successful version update

name: Create a release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  generate-matrix:
    name: Derive Python version matrix from pyproject.toml
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.python-versions.outputs.python-versions }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Read supported versions from classifiers
      id: python-versions
      run: |
        python - <<'EOF' >> "$GITHUB_OUTPUT"
        import json
        import tomllib

        with open("pyproject.toml", "rb") as f:
            classifiers = tomllib.load(f)["project"]["classifiers"]
        
        prefix = "Programming Language :: Python :: 3."
        versions = [
            classifier.rsplit("::", 1)[-1].strip()
            for classifier in classifiers
            if classifier.startswith(prefix)
        ]
        print(f"python-versions={json.dumps(versions)}")
        EOF

  build:
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ${{ fromJson(needs.generate-matrix.outputs.python-versions) }}

    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: "uv.lock"
        enable-cache: false
        python-version: ${{ matrix.python-version }}

    - name: Install library and dependencies
      run: |
        uv sync --frozen

    - uses: messense/maturin-action@v1
      with:
        manylinux: auto
        command: build
        args: --release --sdist --out dist --find-interpreter --auditwheel repair

    - name: Upload builds
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/

      - name: Check Version
        uses: nowsprinting/check-version-format-action@v5
        id: version
        with:
          prefix: 'v'

      - name: Check for Pre-release
        uses: haya14busa/action-cond@v1
        id: is_prerelease
        with:
          cond: ${{ steps.version.outputs.prerelease != '' }}
          if_true: true
          if_false: false

      - name: Get Newest Changelog
        run: |
          python -c "import re; from pathlib import Path; text=re.sub('<!--(.*?)-->', '', (Path.cwd() / 'CHANGELOG.md').read_text(), flags=re.DOTALL); start=text.find('_' * 79); (Path.cwd() / 'TEMP_CHANGELOG.md').write_text(text[start:text.find('_' * 79, start+1)])"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.is_prerelease.outputs.value }}
          body_path: ./TEMP_CHANGELOG.md
          files: |
            *.whl
            *.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true
